name: CI

# Every push and pull request passes the whole standard before it is reviewed:
# composer validate, code style, static analysis, tests.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, iconv
          coverage: none
          tools: composer:v2

      - name: Validate the root manifest
        run: composer validate --strict

      # Every bundle is a package, and its manifest is validated as one.
      - name: Validate every package manifest
        run: |
          for package in src/Vivutio/Contracts/composer.json src/Vivutio/Bundle/*/composer.json; do
            echo "== $package"
            composer validate --strict --no-check-all --working-dir="$(dirname "$package")"
          done

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      # `update`, not `install`: a library is tested against the versions its
      # constraints allow, and the lock is not committed.
      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Code style (php-cs-fixer)
        run: composer cs:check

      - name: Static analysis (PHPStan max)
        run: composer phpstan

      - name: Tests (PHPUnit)
        run: composer test
